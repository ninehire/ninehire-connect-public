name: TEST - Chrome Bundling

# Track B(내장 Chrome 번들링) 검증용 임시 워크플로.
# feat/connect-chrome-bundling 브랜치를 빌드해 다음을 실측한다:
#   - beforePack 이 arch별 CfT를 resources/chrome 에 다운로드/동봉하는지
#   - mac: 번들 Chromium 포함 .app 이 공증(notarize) 통과하는지  ← R1 핵심 검증
#   - win: nsis 패키지에 번들 chrome 이 포함되는지
# 검증 완료 후 삭제 예정.

on:
  workflow_dispatch:

jobs:
  build-mac:
    runs-on: macos-latest
    environment: development
    steps:
      - name: Checkout private repo (feat branch)
        uses: actions/checkout@v4
        with:
          repository: ninehire/ninehire-connect
          ref: feat/connect-chrome-bundling
          token: ${{ secrets.PRIVATE_REPO_TOKEN }}
          path: source

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Enable Corepack
        working-directory: source
        run: corepack enable

      - name: Install dependencies
        working-directory: source
        run: yarn install --immutable

      - name: Import Certificate
        env:
          MAC_CERTIFICATE_BASE64: ${{ secrets.MAC_CERTIFICATE_BASE64 }}
          MAC_CERTIFICATE_PASSWORD: ${{ secrets.MAC_CERTIFICATE_PASSWORD }}
        run: |
          echo "$MAC_CERTIFICATE_BASE64" | base64 --decode > certificate.p12
          security create-keychain -p "$MAC_CERTIFICATE_PASSWORD" build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p "$MAC_CERTIFICATE_PASSWORD" build.keychain
          security import certificate.p12 -k build.keychain -P "$MAC_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$MAC_CERTIFICATE_PASSWORD" build.keychain
          rm certificate.p12

      - name: Build & Notarize
        working-directory: source
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          PROD_URL: ${{ vars.PROD_URL }}
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
          GAMEJOB_DOMAIN: ${{ vars.GAMEJOB_DOMAIN }}
          SARAMIN_DOMAIN: ${{ vars.SARAMIN_DOMAIN }}
          SARAMIN_OLD_DOMAIN: ${{ vars.SARAMIN_OLD_DOMAIN }}
          SARAMIN_API_DOMAIN: ${{ vars.SARAMIN_API_DOMAIN }}
          WANTED_DOMAIN: ${{ vars.WANTED_DOMAIN }}
          WANTED_INTEGRATION_DOMAIN: ${{ vars.WANTED_INTEGRATION_DOMAIN }}
          JOB_KOREA_DOMAIN: ${{ vars.JOB_KOREA_DOMAIN }}
          ALBAMON_DOMAIN: ${{ vars.ALBAMON_DOMAIN }}
          ALBAMON_BFF_COMPANY: ${{ vars.ALBAMON_BFF_COMPANY }}
          ALBAMON_BFF_COMPANY_V1: ${{ vars.ALBAMON_BFF_COMPANY_V1 }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SENTRY_ENVIRONMENT: development
          CRAWLING_ENCRYPTION_KEY: ${{ secrets.CRAWLING_ENCRYPTION_KEY }}
        run: yarn dist:mac:dev

      - name: Verify bundled Chrome in .app (mac)
        working-directory: source
        run: |
          APP=$(find apps/desktop/release -maxdepth 2 -name "*.app" | head -1)
          echo "📦 App bundle: $APP"
          echo "--- Resources/chrome ---"
          ls -la "$APP/Contents/Resources/chrome" || (echo "❌ 번들 chrome 없음" && exit 1)
          BIN=$(find "$APP/Contents/Resources/chrome" -name "Google Chrome for Testing" -type f | head -1)
          echo "Chromium 런처: $BIN"
          [ -n "$BIN" ] && echo "✅ 번들 Chrome 포함 확인" || (echo "❌ Chromium 바이너리 없음" && exit 1)
          echo "--- 번들 Chrome 코드서명 검증 ---"
          CHROME_APP=$(find "$APP/Contents/Resources/chrome" -maxdepth 3 -name "*.app" | head -1)
          codesign -dv --verbose=2 "$CHROME_APP" 2>&1 | head -20 || echo "⚠️ codesign 조회 실패"

      - name: Copy artifacts
        run: |
          mkdir -p artifacts
          cp source/apps/desktop/release/*.dmg artifacts/ 2>/dev/null || echo "No DMG files found"

      - name: Clean source code
        run: rm -rf source

      - uses: actions/upload-artifact@v4
        with:
          name: test-mac-dmg-bundled
          path: artifacts/*.dmg
          retention-days: 7

  build-windows:
    runs-on: windows-latest
    environment: development
    steps:
      - name: Checkout private repo (feat branch)
        uses: actions/checkout@v4
        with:
          repository: ninehire/ninehire-connect
          ref: feat/connect-chrome-bundling
          token: ${{ secrets.PRIVATE_REPO_TOKEN }}
          path: source

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Enable Corepack
        working-directory: source
        run: corepack enable

      - name: Install dependencies
        working-directory: source
        run: yarn install --immutable

      - name: Build
        working-directory: source
        env:
          PROD_URL: ${{ vars.PROD_URL }}
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
          GAMEJOB_DOMAIN: ${{ vars.GAMEJOB_DOMAIN }}
          SARAMIN_DOMAIN: ${{ vars.SARAMIN_DOMAIN }}
          SARAMIN_OLD_DOMAIN: ${{ vars.SARAMIN_OLD_DOMAIN }}
          SARAMIN_API_DOMAIN: ${{ vars.SARAMIN_API_DOMAIN }}
          WANTED_DOMAIN: ${{ vars.WANTED_DOMAIN }}
          WANTED_INTEGRATION_DOMAIN: ${{ vars.WANTED_INTEGRATION_DOMAIN }}
          JOB_KOREA_DOMAIN: ${{ vars.JOB_KOREA_DOMAIN }}
          ALBAMON_DOMAIN: ${{ vars.ALBAMON_DOMAIN }}
          ALBAMON_BFF_COMPANY: ${{ vars.ALBAMON_BFF_COMPANY }}
          ALBAMON_BFF_COMPANY_V1: ${{ vars.ALBAMON_BFF_COMPANY_V1 }}
          SENTRY_ENVIRONMENT: development
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CRAWLING_ENCRYPTION_KEY: ${{ secrets.CRAWLING_ENCRYPTION_KEY }}
        run: yarn dist:win:dev

      - name: Verify bundled Chrome (win)
        working-directory: source
        shell: pwsh
        run: |
          $chromeDir = "apps/desktop/release/win-unpacked/resources/chrome"
          if (Test-Path $chromeDir) {
            Write-Host "✅ 번들 chrome 디렉토리 존재: $chromeDir"
            Get-ChildItem -Recurse $chromeDir -Filter "chrome.exe" | Select-Object FullName, Length
          } else {
            Write-Host "❌ 번들 chrome 없음: $chromeDir"
            exit 1
          }

      - name: Copy artifacts
        run: |
          mkdir artifacts
          copy source\apps\desktop\release\*.exe artifacts\ 2>nul || echo No EXE files found
        shell: cmd

      - name: Clean source code
        run: Remove-Item -Recurse -Force source
        shell: powershell

      - uses: actions/upload-artifact@v4
        with:
          name: test-windows-exe-bundled
          path: artifacts/*.exe
          retention-days: 7
