name: Build Dev (PRD Env)

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: connect-build-dev-prd-env
  cancel-in-progress: false

env:
  SANITIZED_SOURCE_REF: dev

jobs:
  build-mac:
    name: Build signed and notarized macOS dev candidate with PRD environment
    runs-on: macos-14
    environment: production
    timeout-minutes: 120
    steps:
      - name: Checkout private sanitized dev source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: ninehire/ninehire-connect
          ref: ${{ env.SANITIZED_SOURCE_REF }}
          token: ${{ secrets.PRIVATE_REPO_TOKEN }}
          path: source
          persist-credentials: false
          fetch-depth: 1

      - name: Set up Node 20.11.1
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20.11.1

      - name: Enable Corepack and install immutable dependencies
        working-directory: source
        shell: bash
        run: |
          set -euo pipefail
          corepack enable
          yarn install --immutable

      - name: Import signing certificate into an ephemeral keychain
        env:
          MAC_CERTIFICATE_BASE64: ${{ secrets.MAC_CERTIFICATE_BASE64 }}
          MAC_CERTIFICATE_PASSWORD: ${{ secrets.MAC_CERTIFICATE_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          : "${MAC_CERTIFICATE_BASE64:?MAC_CERTIFICATE_BASE64 is required}"
          : "${MAC_CERTIFICATE_PASSWORD:?MAC_CERTIFICATE_PASSWORD is required}"

          certificate_path="$RUNNER_TEMP/connect-signing-certificate.p12"
          keychain_path="$RUNNER_TEMP/connect-signing.keychain-db"
          original_keychain="$(
            security default-keychain -d user |
              sed -E 's/^[[:space:]]*"//; s/"[[:space:]]*$//'
          )"

          printf '%s' "$MAC_CERTIFICATE_BASE64" | base64 --decode > "$certificate_path"
          security create-keychain -p "$MAC_CERTIFICATE_PASSWORD" "$keychain_path"
          security set-keychain-settings -lut 21600 "$keychain_path"
          security unlock-keychain -p "$MAC_CERTIFICATE_PASSWORD" "$keychain_path"
          security import "$certificate_path" \
            -k "$keychain_path" \
            -P "$MAC_CERTIFICATE_PASSWORD" \
            -T /usr/bin/codesign
          security set-key-partition-list \
            -S apple-tool:,apple:,codesign: \
            -s \
            -k "$MAC_CERTIFICATE_PASSWORD" \
            "$keychain_path"
          security list-keychains -d user -s "$keychain_path" "$original_keychain"
          security default-keychain -d user -s "$keychain_path"

          {
            echo "CONNECT_CERTIFICATE_PATH=$certificate_path"
            echo "CONNECT_SIGNING_KEYCHAIN=$keychain_path"
            echo "CONNECT_ORIGINAL_KEYCHAIN=$original_keychain"
          } >> "$GITHUB_ENV"

      - name: Build and notarize dev candidate with PRD environment
        working-directory: source
        env:
          ALBAMON_BFF_COMPANY: ${{ vars.ALBAMON_BFF_COMPANY }}
          ALBAMON_BFF_COMPANY_V1: ${{ vars.ALBAMON_BFF_COMPANY_V1 }}
          ALBAMON_DOMAIN: ${{ vars.ALBAMON_DOMAIN }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          CRAWLING_ENCRYPTION_KEY: ${{ secrets.CRAWLING_ENCRYPTION_KEY }}
          GAMEJOB_DOMAIN: ${{ vars.GAMEJOB_DOMAIN }}
          JOBKOREA_BIZCENTER_DISPLAY_V2: ${{ vars.JOBKOREA_BIZCENTER_DISPLAY_V2 }}
          JOB_KOREA_DOMAIN: ${{ vars.JOB_KOREA_DOMAIN }}
          NEXT_DEV_URL: ${{ vars.DEV_URL }}
          PROD_URL: ${{ vars.DEV_URL }}
          SARAMIN_API_DOMAIN: ${{ vars.SARAMIN_API_DOMAIN }}
          SARAMIN_DOMAIN: ${{ vars.SARAMIN_DOMAIN }}
          SARAMIN_OLD_DOMAIN: ${{ vars.SARAMIN_OLD_DOMAIN }}
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
          SENTRY_ENVIRONMENT: development
          WANTED_DOMAIN: ${{ vars.WANTED_DOMAIN }}
          WANTED_INTEGRATION_DOMAIN: ${{ vars.WANTED_INTEGRATION_DOMAIN }}
        shell: bash
        run: |
          set -euo pipefail
          rm -rf -- apps/connect-desktop/release
          yarn workspace @ninehire/connect-desktop dist:mac:dev

      - name: Upload macOS dev candidate with PRD environment
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: mac-dev-prd-env-candidate-${{ github.run_id }}
          path: |
            source/apps/connect-desktop/release/NinehireConnect-*-arm64.dmg
            source/apps/connect-desktop/release/NinehireConnect-*-arm64.zip
            source/apps/connect-desktop/release/latest-mac.yml
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

      - name: Remove certificate and ephemeral keychain
        if: always()
        shell: bash
        run: |
          set +e
          if [[ -n "${CONNECT_ORIGINAL_KEYCHAIN:-}" ]]; then
            security default-keychain -d user -s "$CONNECT_ORIGINAL_KEYCHAIN"
          fi
          keychain_path="${CONNECT_SIGNING_KEYCHAIN:-$RUNNER_TEMP/connect-signing.keychain-db}"
          security delete-keychain "$keychain_path" 2>/dev/null || true
          rm -f "${CONNECT_CERTIFICATE_PATH:-$RUNNER_TEMP/connect-signing-certificate.p12}"

  build-windows:
    name: Build unsigned bundled and lite Windows dev candidates with PRD environment
    needs: build-mac
    runs-on: windows-latest
    environment: production
    timeout-minutes: 120
    steps:
      - name: Checkout private sanitized dev source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: ninehire/ninehire-connect
          ref: ${{ env.SANITIZED_SOURCE_REF }}
          token: ${{ secrets.PRIVATE_REPO_TOKEN }}
          path: source
          persist-credentials: false
          fetch-depth: 1

      - name: Set up Node 20.11.1
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20.11.1

      - name: Build unsigned Windows dev candidates sequentially with PRD environment
        working-directory: source
        env:
          ALBAMON_BFF_COMPANY: ${{ vars.ALBAMON_BFF_COMPANY }}
          ALBAMON_BFF_COMPANY_V1: ${{ vars.ALBAMON_BFF_COMPANY_V1 }}
          ALBAMON_DOMAIN: ${{ vars.ALBAMON_DOMAIN }}
          CRAWLING_ENCRYPTION_KEY: ${{ secrets.CRAWLING_ENCRYPTION_KEY }}
          GAMEJOB_DOMAIN: ${{ vars.GAMEJOB_DOMAIN }}
          JOBKOREA_BIZCENTER_DISPLAY_V2: ${{ vars.JOBKOREA_BIZCENTER_DISPLAY_V2 }}
          JOB_KOREA_DOMAIN: ${{ vars.JOB_KOREA_DOMAIN }}
          NEXT_DEV_URL: ${{ vars.DEV_URL }}
          SARAMIN_API_DOMAIN: ${{ vars.SARAMIN_API_DOMAIN }}
          SARAMIN_DOMAIN: ${{ vars.SARAMIN_DOMAIN }}
          SARAMIN_OLD_DOMAIN: ${{ vars.SARAMIN_OLD_DOMAIN }}
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
          SENTRY_ENVIRONMENT: development
          WANTED_DOMAIN: ${{ vars.WANTED_DOMAIN }}
          WANTED_INTEGRATION_DOMAIN: ${{ vars.WANTED_INTEGRATION_DOMAIN }}
        shell: pwsh
        run: ./apps/connect-desktop/scripts/build-win-public.ps1 -Environment development

      - name: Upload unsigned Windows dev candidates with PRD environment
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: windows-dev-prd-env-build-only-${{ github.run_id }}
          path: |
            source/apps/connect-desktop/release/NinehireConnect-*-x64.exe
            source/apps/connect-desktop/release/NinehireConnect-*-x64.exe.blockmap
            source/apps/connect-desktop/release/latest-bundled.yml
            source/apps/connect-desktop/release/latest.yml
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
