# STEP 8 TEMPLATE ONLY.
# This unsigned build-only job stays disabled until the action SHAs and macOS runner are reviewed.
# Materialize only as .github/workflows/test-2variant.yml (existing workflow ID 306456034).
name: Build unsigned macOS candidates from sanitized source

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  SANITIZED_SOURCE_REF: 3792adda187d4395f3e27858ae70741a516b1447

jobs:
  build-mac-public:
    runs-on: macos-latest
    environment: production
    steps:
      - name: Checkout exact protected sanitized source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: ninehire/ninehire-connect
          ref: 3792adda187d4395f3e27858ae70741a516b1447
          token: ${{ secrets.PRIVATE_REPO_TOKEN }}
          path: source
          persist-credentials: false
          fetch-depth: 1

      - name: Set up Node 20.11.1
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 20.11.1

      - name: Build unsigned bundled and lite candidates sequentially
        working-directory: source
        env:
          ALBAMON_BFF_COMPANY: ${{ vars.ALBAMON_BFF_COMPANY }}
          ALBAMON_BFF_COMPANY_V1: ${{ vars.ALBAMON_BFF_COMPANY_V1 }}
          ALBAMON_DOMAIN: ${{ vars.ALBAMON_DOMAIN }}
          CRAWLING_ENCRYPTION_KEY: ${{ secrets.CRAWLING_ENCRYPTION_KEY }}
          GAMEJOB_DOMAIN: ${{ vars.GAMEJOB_DOMAIN }}
          JOB_KOREA_DOMAIN: ${{ vars.JOB_KOREA_DOMAIN }}
          PROD_URL: ${{ vars.PROD_URL }}
          SARAMIN_API_DOMAIN: ${{ vars.SARAMIN_API_DOMAIN }}
          SARAMIN_DOMAIN: ${{ vars.SARAMIN_DOMAIN }}
          SARAMIN_OLD_DOMAIN: ${{ vars.SARAMIN_OLD_DOMAIN }}
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
          SENTRY_ENVIRONMENT: production
          WANTED_DOMAIN: ${{ vars.WANTED_DOMAIN }}
          WANTED_INTEGRATION_DOMAIN: ${{ vars.WANTED_INTEGRATION_DOMAIN }}
        run: bash ./apps/connect-desktop/scripts/build-mac-public.sh production

      - name: Upload unsigned build evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: macos-public-build-only
          path: |
            source/apps/connect-desktop/release/NinehireConnect-*-arm64.dmg
            source/apps/connect-desktop/release/NinehireConnect-*-arm64.zip
            source/apps/connect-desktop/release/latest-bundled-mac.yml
            source/apps/connect-desktop/release/latest-mac.yml
          if-no-files-found: error
          retention-days: 7
