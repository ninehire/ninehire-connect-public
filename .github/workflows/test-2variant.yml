name: POC Monorepo - Build unsigned Windows candidates

# 이 candidate 브랜치에서만 사용하는 수동 build-only 검증이다.
# private source의 정확한 sanitized commit만 checkout하며 sign, release, publish는 실행하지 않는다.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: poc-monorepo-connect-windows-build
  cancel-in-progress: false

jobs:
  build-windows:
    name: Build unsigned bundled and lite candidates
    runs-on: windows-latest
    timeout-minutes: 120
    environment: production
    steps:
      - name: Checkout exact private sanitized source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: ninehire/ninehire-connect
          ref: 43b74e6024e69061bf6c9e27c24c3f2eb4a99646
          token: ${{ secrets.PRIVATE_REPO_TOKEN }}
          path: source
          persist-credentials: false
          fetch-depth: 1

      - name: Set up Node 20.11.1
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20.11.1

      - name: Build unsigned bundled and lite candidates sequentially
        working-directory: source
        env:
          ALBAMON_BFF_COMPANY: ${{ vars.ALBAMON_BFF_COMPANY }}
          ALBAMON_BFF_COMPANY_V1: ${{ vars.ALBAMON_BFF_COMPANY_V1 }}
          ALBAMON_DOMAIN: ${{ vars.ALBAMON_DOMAIN }}
          CRAWLING_ENCRYPTION_KEY: ${{ secrets.CRAWLING_ENCRYPTION_KEY }}
          GAMEJOB_DOMAIN: ${{ vars.GAMEJOB_DOMAIN }}
          JOB_KOREA_DOMAIN: ${{ vars.JOB_KOREA_DOMAIN }}
          PROD_URL: ${{ vars.PROD_URL }}
          SARAMIN_API_DOMAIN: ${{ vars.SARAMIN_API_DOMAIN }}
          SARAMIN_DOMAIN: ${{ vars.SARAMIN_DOMAIN }}
          SARAMIN_OLD_DOMAIN: ${{ vars.SARAMIN_OLD_DOMAIN }}
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
          SENTRY_ENVIRONMENT: production
          WANTED_DOMAIN: ${{ vars.WANTED_DOMAIN }}
          WANTED_INTEGRATION_DOMAIN: ${{ vars.WANTED_INTEGRATION_DOMAIN }}
        run: pwsh -NoProfile -File ./apps/connect-desktop/scripts/build-win-public.ps1 -Environment production

      - name: Upload unsigned build evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: monorepo-connect-windows-build-only
          path: |
            source/apps/connect-desktop/release/NinehireConnect-*-x64.exe
            source/apps/connect-desktop/release/NinehireConnect-*-x64.exe.blockmap
            source/apps/connect-desktop/release/latest-bundled.yml
            source/apps/connect-desktop/release/latest.yml
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
